<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light by default for everyone; dark only when the visitor picks it with the toggle -->
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="description" content="RollOne takes lecture attendance in seconds: one rotating code on the projector, a geofenced scan and a face check on every student's phone." />
    <script>
      (function () {
        var saved = 'light';
        try { saved = localStorage.getItem('campustrack-theme') || 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>RollOne · Lecture attendance in seconds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
