version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: attendance_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  ml_service:
    build: ./ml_service
    container_name: attendance_ml
    ports:
      - "5001:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    container_name: attendance_backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/attendance_system
      - JWT_SECRET=${JWT_SECRET}
      - ML_SERVICE_URL=http://ml_service:5001
    depends_on:
      - mongodb
      - ml_service
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: attendance_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
